[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vac-cementometry"
version = "0.2.0"
description = "Desktop vibroacoustic cementometry interpretation"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
vac = "vac.app:main"

[tool.setuptools]
packages = ["vac", "vac.resources", "vac.domain", "vac.io", "vac.processing", "vac.services", "vac.gui", "vac.reporting"]
py-modules = ["VAC_dialog", "responsive_layout", "standard", "VAC_python", "VAC_python_mini"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
"vac.resources" = ["*.docx"]
