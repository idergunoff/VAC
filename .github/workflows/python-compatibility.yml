name: Python compatibility

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-xinerama0
      - run: python -m pip install --upgrade pip
      - run: 'python -m pip install --only-binary=:all: -e .'
      - run: python -m pip check
      - run: python -W ignore -m unittest discover -s tests/unit -v
      - run: python -W ignore -m unittest discover -s tests/integration -v
      - run: python tests/check_package.py
      - run: python tests/check_responsive_layout.py
